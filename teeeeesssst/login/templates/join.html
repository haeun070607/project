{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>join</title>
    <style>

        body{margin: 0; padding: 0; width: 100%; height: 100vh;overflow-x: hidden; max-height: 100vh;display: grid; grid-template-rows: repeat(3, minmax(50px,auto));}
        a{text-decoration: none;}
        #logo{width: 13vw; height: 12vh; margin-left: 43%;margin-top: 5vh;}
        input {border: none;outline: none;box-sizing: border-box;}
        hr{justify-self: self-start;}
        #join_form{justify-items: center;}
        
        #join_container{margin-top: 5vh;border: 2px solid #a4786454; border-radius: 5px; min-height: 65vh; width: 30vw; justify-items: center; align-content: center; padding: 20px 0;}
        
        .join_detail, .join_postcode{border-bottom: 1px solid #a4786454; width: 28vw; height: 7vh; display: flex; align-items: center; justify-content: space-between;}
        
        .pw_block{border-bottom: 1px solid #a4786454; width: 28vw; min-height: 7vh; display: flex; flex-direction: column; justify-content: center;}
        
        .input_text{width: 100%; height: 100%;}
        .has_btn_input{width: 68%; height: 100%;}

        #user_id_check, #postcode_btn{height: 4vh; width: 28%; font-size: 11px; background-color: #A47864; border-radius: 5px; color: white; border: 2px outset; border-color: #775f52 #d3ae9b #997360 #6d4f40; font-weight: bold; cursor: pointer;}
        #join_btn{height: 5vh; width: 8vw; margin-top: 30px; font-size: 17px; background-color: #A47864; border-radius: 5px; color: white; border: 2px outset; border-color: #775f52 #d3ae9b #997360 #6d4f40; font-weight: bold; cursor: pointer;}

        #name::placeholder, #user_id::placeholder, #user_pw::placeholder, #birth::placeholder, #phonenum::placeholder, #sample4_postcode::placeholder, #sample4_roadAddress::placeholder, #sample4_detailAddress::placeholder{color: #A47864;}

        #pw_msg{font-size: 11px; margin-top: 4px; display: block;}

    </style>
</head>
<body>
    <header>

        <a href="/"><img src="{% static 'logo_brown.png' %}" alt="logo" id="logo"></a>
    
    </header>
    <main>
        <form method="post" action="/join/" id="join_form" onsubmit="return validateForm()">
            {% csrf_token %}
            <div id="join_container">
                <div class="join_detail">
                    <input type="text" name="name" id="name" class="input_text" placeholder="이름">
                </div>
                <div class="join_detail">
                    <input type="text" name="user_id" class="has_btn_input" id="user_id" placeholder="아이디">
                    <input type="submit" value="중복확인" id="user_id_check">
                </div>
                <div class="pw_block">
                    <input type="password" name="user_pw" class="input_text" id="user_pw" placeholder="비밀번호 (8~16자 영문, 숫자, 특수문자)" style="height: 4vh;" oninput="pw_reg()">
                    <span id="pw_msg"></span>
                </div>
                <div class="join_detail">
                    <input type="text" name="birth" class="input_text" id="birth" placeholder="생년월일">      
                </div>
                <div class="join_detail">
                    <input type="text" name="phonenum" class="input_text" id="phonenum" placeholder="전화번호">            
                </div>
                <div class="join_postcode">
                    <input type="text" id="sample4_postcode" name="postcode" class="has_btn_input" readonly placeholder="우편번호">
                    <button type="button" id="postcode_btn" onclick="execDaumPostcode()">우편번호 찾기</button>
                </div>
                <div class="join_detail">
                    <input type="text" id="sample4_roadAddress" class="input_text" name="roadname" readonly placeholder="도로명">
                </div>
                <div class="join_detail">
                    <input type="text" id="sample4_detailAddress" class="input_text" name="address" placeholder="상세 주소">
                </div>
                <div>
                    <input type="submit" id="join_btn" value="회원가입">
                </div>
            </div>
        </form>
    </main>
    <footer>

    </footer>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    {% if msg %}
    <script>
        alert("{{ msg }}");
    </script>
    {% endif %}
    <script>

    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                var roadAddr = data.roadAddress; 
                var extraRoadAddr = ''; 

                if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                    extraRoadAddr += data.bname;
                }
                if(data.buildingName !== '' && data.apartment === 'Y'){
                    extraRoadAddr += (extraRoadAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                }
                if(extraRoadAddr !== ''){
                    extraRoadAddr = ' (' + extraRoadAddr + ')';
                }

                document.getElementById('sample4_postcode').value = data.zonecode;
                document.getElementById('sample4_roadAddress').value = roadAddr;
                document.getElementById('sample4_detailAddress').focus();
            }
        }).open();
    }

    const pwRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{8,16}$/;


    function pw_reg() {
        const pwInput = document.getElementById('user_pw').value;
        const msg = document.getElementById('pw_msg');

        if (pwInput === '') {
            msg.innerText = '';
            return false;
        }
        
        if (pwRegex.test(pwInput)) {
            msg.innerText = '사용 가능한 비밀번호입니다.';
            msg.style.color = 'green'; 
            return true;
        } else {
            msg.innerText = '영문, 숫자, 특수문자(!@#$%^&*)를 포함해 8~16자로 입력하세요.';
            msg.style.color = 'red';
            return false;
        }
    }


    function validateForm() {

        if (!pw_reg()) {
            alert('비밀번호 형식이 올바르지 않습니다.');
            document.getElementById('user_pw');
            return false;
        }
        return true;
    }
    </script>
    
</body>
</html>
