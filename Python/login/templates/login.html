{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        body{margin: 0;padding: 0;}
        main{ margin: 0 34.9vw;}

        a{text-decoration: none; color: #A47864;}

        #logo{height: 6.35vh;margin: 15vh 45vw 5vh 45vw;justify-content: center;align-self: center;justify-self: center;}

        /*로그인 창*/
        #login_container{margin-top: 5vh;border: 2px solid #a4786454; border-radius: 5px;height: 30vh;justify-items: center;align-content: center;}
        hr{justify-self: self-start;}
        #user_pw,#user_id{border: none;background:none;outline: none;width: 28.5vw;font-size: 15px;height: 5vh;padding: 9px;}
        #login_id{border-bottom: 1px solid  #a4786454;width: 28vw; height: 7vh; align-content: center;}
        #login_pw{border-bottom: 1px solid  #a4786454;width: 28vw; height: 7vh; align-content: center;margin-bottom: 10px;}

        /*입력 창 미리보기 텍스트 색 변경*/
        #user_id::placeholder{color: #A47864;}
        #user_pw::placeholder{color: #A47864;}

        /*로그인 버튼*/
        #login_btn{height: 5vh;width:8vw;margin-top: 30px;font-size: 17px;background-color:  #A47864; border-radius: 5px; color: white; border: 2px outset;border-color: #775f52 #d3ae9b #997360 #6d4f40;font-weight: bold}

        #link_menu{display: flex;margin-top: 1.5vh;justify-content: center;}
        .link{font-size:medium; margin: 0 2.5vw;}
    </style>
</head>
<body>
    <!--로고-->
    <header><div id="logo"><a href="/"><img src="{% static 'logo_brown.png' %}" alt="이미지" width="120px"></a></div></header>
    <main>
    <form method="POST" action="/login/">
        {% csrf_token %}
        <div id="login_container" name="singup">
            <div id="login_id">
                <input type="text" id="user_id" name="user_id" placeholder="아이디">
            </div>
            <div id="login_pw">
                <input type="password" id="user_pw" name="user_pw" placeholder="비밀번호">
            </div>
            <div>
                <input id="login_btn" type="submit" value="로그인">
            </div>
        </div>
    </form>
    <div id="link_menu">
        <a href="/" class="link">메인화면</a>
        <a href="/join/" class="link">회원가입</a>
    </div>
    </main>


    {% if msg %}
    <script>
        alert("{{ msg }}");
    </script>
    {% endif %}
    </main>

</body> 
</html>
