<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ posts.0.1}}</title>
    <style>
        body{margin: 0; padding: 0; width: 100%; min-height: 100vh; max-height: auto;overflow-x: hidden; display: grid;grid-template-rows:  repeat(2, minmax(50px,auto));}
        main{margin: 0 20vw; height: 100%; margin-bottom: 0;grid-row: 1/2;}
        footer{background-color:#a4786454;padding-left: 50px; padding-top: 15px; padding-bottom: 50px;grid-row: 2/3;}

        a{text-decoration: none; color: black;}

        #menu{display: flex;  justify-content: center; width: 60vw;}
        .menu_detail{ margin: 10px 80px;}

        #delete{margin-left: 45.5vw;}
        #post_writer{margin-bottom: 30px;display: flex;}
        #writer{align-self:flex-end;}
        #post_date {font-size: 0.85rem; color: #575757;align-self:flex-end;}
        #title{font-size: 30px; font-weight: bold;margin-top: 50px; margin-bottom: 8px;}
        hr{opacity: 30%;}
        #post_content{margin-top: 30px;}
        #comments{margin-top: 30px;margin-bottom: 50px;}
        #heart_red{display: none;}
        #heart{display: block;}

        /*하단영역 css*/
        #notice{font-size: 20px; font-weight: bold;margin-bottom: 10px;color: #6d4f40;}
        #footer_2{display:flex; flex-wrap: wrap; justify-items: center; margin-top: 15px;color: #A47864;}
        #footer_3{display:flex; flex-wrap: wrap; justify-items: center; margin-top: 3px;color: #A47864;}
        .footer_3_menu{margin-right: 30px; color: #A47864;}
        .hr_class{width: 150vw; margin-left: -50vw; opacity: 30%;}
    </style>
</head>
<body>
    <main>
        <div>
            <div id="post">
                {% for post in posts %}
                <div  class="post-card">
                    <div id="title">
                        {{ post.1}}
                    </div>
                    <div id="post_writer">
                        <span id="writer">{{ post.4 }}</span>
                        <span style="font-size: 0.85rem; color: #575757;align-self:flex-end;margin: 0 5px">|</span>
                        <span id="post_date" style=" color: #A47864;">{{ post.3|date:"Y년 m월 d일 H시 i분" }}</span>
                        
                        {% if post.5 == user %}
                            <a href="delete"><svg xmlns="http://www.w3.org/2000/svg" id="delete" width="24" height="24" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.08008 7.03297L5.50008 21.873H18.5001L19.9201 7.03297H4.08008Z" class="fill-color0"/><path fill-rule="evenodd" clip-rule="evenodd" d="M17.9381 3.56208H16.3571V2.12708H7.64307V3.56208H6.06207V5.06208H17.9381V3.56208Z" class="fill-color0"/><style>.fill-color0 { fill: #A47864; } </style></svg></a>
                        {% elif  none == user  %}
                            <div></div>
                        {% endif %}
                         
                    </div>
                    <hr color="#A47864">
                    <div id="post_content">
                        {{ post.2 |linebreaksbr }}
                    </div>
                </div>
                {% endfor %}
            </div>
            
            <div id="comments">
                <hr  color="#A47864">
                
                <svg xmlns="http://www.w3.org/2000/svg" id="heart_red" width="30" height="30" fill="none" viewBox="0 0 24 24"><path fill="red" fill-rule="evenodd" d="M17.441 3.371c-2.096-.677-4.007-.113-5.44 1.583-1.436-1.698-3.347-2.259-5.44-1.583-2.648.852-4.299 3.243-4.31 6.24-.025 5.133 4.916 9.155 9.547 11.207l.203.09.203-.09c4.632-2.052 9.571-6.074 9.546-11.208-.012-2.996-1.663-5.387-4.309-6.239" clip-rule="evenodd"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" id="heart" width="30" height="30" fill="none" viewBox="0 0 24 24"><path stroke="#6d4f40" stroke-linecap="square" stroke-width="1.5" d="M21.25 9.636c-.01-2.536-1.34-4.921-3.963-5.766-1.801-.581-3.763-.258-5.287 1.93-1.524-2.188-3.486-2.511-5.287-1.93C4.09 4.715 2.76 7.1 2.75 9.636 2.726 14.68 7.837 18.54 12 20.384H12c4.163-1.844 9.274-5.704 9.249-10.748Z"/></svg>
            </div>
        </div>
    </main>         


   <footer>
        <div id="notice">공지사항</div>
        <hr class="hr_class"  color="#A47864">
        <div id="footer_2">
          <a href="/" class="footer_3_menu">회사 정보</a>
          <a href="/" class="footer_3_menu">무슨 정보</a>
          <a href="/" class="footer_3_menu">이용안내</a>
        </div>

        <div id="footer_3">
          <a href="/" class="footer_3_menu">회사소개</a>
          <a href="/" class="footer_3_menu">이용약관</a>
          <a href="/" class="footer_3_menu">개인정보처리방침</a>
          <a href="/" class="footer_3_menu">청소년보호정책</a>
          <a href="/" class="footer_3_menu">Blog 정책</a>
          <a href="/" class="footer_3_menu">고객센터</a>
        </div>

    <script>
        const heart= document.getElementById("heart")
        const heart_red= document.getElementById("heart_red")
        
        heart.addEventListener("click",()=>{
            heart.style="display: none;cursor: pointer;"
            heart_red.style="display: block;cursor: pointer;"
            
        })

        heart_red.addEventListener("click",()=>{
            heart_red.style="display: none;cursor: pointer;"
            heart.style="display: block;cursor: pointer;"
        })
    </script>
</body>
</html>
