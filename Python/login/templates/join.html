<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>join</title>
</head>dfasdasd
<body>
    <form method="post" action="/join/">
        {% csrf_token %}
        <div>
            <label>이름</label>
            <input type="text" name="name">
            
            <label>아이디</label>
            <input type="text" name="user_id">

            <label>비밀번호</label>
            <input type="password" name="user_pw">

            <label>생년원일</label>
            <input type="text" name="birth">      

            <label>전화번호</label>
            <input type="text" name="phonenum">            

            <div>
                <label>우편번호</label>
                <input type="text" id="sample4_postcode" name="postcode" readonly>
                <button type="button" onclick="execDaumPostcode()">우편번호 찾기</button>
            </div>
            <div>
                <label>도로명 주소</label>
                <input type="text" id="sample4_roadAddress" name="roadname" readonly>
            </div>
            <div>
                <label>상세 주소</label>
                <input type="text" id="sample4_detailAddress" name="address">
            </div>

            <input type="submit" value="회원가입">
        </div>
    </form>


    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
function execDaumPostcode() {
    new daum.Postcode({
        oncomplete: function(data) {
            var roadAddr = data.roadAddress; // 도로명 주소 변수
            var extraRoadAddr = ''; // 참고 항목 변수

            if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                extraRoadAddr += data.bname;
            }
            if(data.buildingName !== '' && data.apartment === 'Y'){
                extraRoadAddr += (extraRoadAddr !== '' ? ', ' + data.buildingName : data.buildingName);
            }
            if(extraRoadAddr !== ''){
                extraRoadAddr = ' (' + extraRoadAddr + ')';
            }

            // 우편번호와 주소 정보를 해당 필드에 넣는다.
            document.getElementById('sample4_postcode').value = data.zonecode;
            document.getElementById('sample4_roadAddress').value = roadAddr;
            // 상세주소 입력 칸에 포커스
            document.getElementById('sample4_detailAddress').focus();
        }
    }).open();
}
</script>


    {% if msg %}
    <script>
        alert("{{ msg }}");
    </script>
    {% endif %}
</body>
</html>
